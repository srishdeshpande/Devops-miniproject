<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JavaScript Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background-color: #f0f2f5;
    }

    .calculator {
      background-color: #1e1e2e;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 320px;
    }

    #display {
      width: 100%;
      height: 70px;
      background-color: #2b2b3c;
      color: #ffffff;
      border: none;
      border-radius: 10px;
      margin-bottom: 16px;
      padding: 0 16px;
      font-size: 2rem;
      text-align: right;
    }

    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      height: 65px; <!-- height attribute input made to 65 -->
      font-size: 1.25rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      background-color: #313244;
      color: #cdd6f4;
      transition: background-color 0.15s, transform 0.05s;
    }

    button:hover {
      background-color: #45475a;
    }

    button:active {
      transform: scale(0.96);
    }

    .operator {
      background-color: #f38ba8;
      color: #11111b;
    }

    .operator:hover {
      background-color: #f5a3b9;
    }

    .action {
      background-color: #fab387;
      color: #11111b;
    }

    .action:hover {
      background-color: #fbc3a0;
    }

    .equals {
      background-color: #a6e3a1;
      color: #11111b;
      grid-column: span 2;
    }

    .equals:hover {
      background-color: #b9ebb4;
    }
  </style>
</head>
<body>
 <H1> wellcome to calculator </H1> <!-- Heading is added -->
  <div class="calculator">
    <input type="text" id="display" readonly placeholder="0">
    
    <div class="buttons">
      <button class="action" onclick="clearDisplay()">AC</button>
      <button class="action" onclick="deleteLast()">DEL</button>
      <button class="operator" onclick="appendValue('%')">%</button>
      <button class="operator" onclick="appendValue('/')">÷</button>

      <button onclick="appendValue('7')">7</button>
      <button onclick="appendValue('8')">8</button>
      <button onclick="appendValue('9')">9</button>
      <button class="operator" onclick="appendValue('*')">×</button>

      <button onclick="appendValue('4')">4</button>
      <button onclick="appendValue('5')">5</button>
      <button onclick="appendValue('6')">6</button>
      <button class="operator" onclick="appendValue('-')">−</button>

      <button onclick="appendValue('1')">1</button>
      <button onclick="appendValue('2')">2</button>
      <button onclick="appendValue('3')">3</button>
      <button class="operator" onclick="appendValue('+')">+</button>

      <button onclick="appendValue('0')">0</button>
      <button onclick="appendValue('.')">.</button>
      <button class="equals" onclick="calculate()">=</button>
    </div>
  </div>

  <script>
    const display = document.getElementById('display');

    function appendValue(value) {
      if (display.value === 'Error') {
        display.value = '';
      }
      display.value += value;
    }

    function clearDisplay() {
      display.value = '';
    }

    function deleteLast() {
      if (display.value === 'Error') {
        display.value = '';
      } else {
        display.value = display.value.slice(0, -1);
      }
    }

    function calculate() {
      try {
        // Allow only numbers, operators, decimals, and parentheses
        const sanitized = display.value.replace(/[^0-9+\-*/.%()]/g, '');
        if (!sanitized) return;

        // Evaluate the sanitized expression safely
        const result = new Function('return ' + sanitized)();
        
        if (!isFinite(result)) {
          display.value = 'Error';
        } else {
          // Round floating-point inaccuracies (e.g., 0.1 + 0.2)
          display.value = Number(result.toFixed(10));
        }
      } catch (error) {
        display.value = 'Error';
      }
    }

    // Optional keyboard support
    document.addEventListener('keydown', (event) => {
      const key = event.key;
      if (/[0-9+\-*/.%]/.test(key)) {
        appendValue(key);
      } else if (key === 'Enter' || key === '=') {
        event.preventDefault();
        calculate();
      } else if (key === 'Backspace') {
        deleteLast();
      } else if (key === 'Escape') {
        clearDisplay();
      }
    });
  </script>

</body>
</html>
